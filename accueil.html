<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rhythm Game</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Arial Black', Arial, sans-serif;
            background: radial-gradient(circle at top, #2b2b45, #0f0f1a);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: repeating-radial-gradient(
                circle,
                rgba(255, 76, 96, 0.15) 0px,
                rgba(255, 76, 96, 0.15) 2px,
                transparent 2px,
                transparent 20px
            );
            animation: pulse 6s linear infinite;
        }

        @keyframes pulse {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        h1 {
            font-size: 4.5em;
            letter-spacing: 6px;
            text-shadow: 0 0 15px #ff4c60;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #ff4c60;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ff4c60;
            box-shadow: 0 0 15px #ff4c60;
            transform: scale(1.05);
        }

        /* Petit indicateur pour cliquer et lancer la musique */
        #clickPrompt {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<audio id="music" loop>
    <source src="yyyyy.wav" type="audio/wav">
</audio>

<div class="container">
    <h1>RHYTHM GAME</h1>
    <p>Frappe au bon moment.</p>

    <div class="menu">
        <button onclick="goTo('jeu.html')">Niveau 1</button>
        <button onclick="goTo('niveaux_2.html')">Niveau 2</button>
        <button onclick="goTo('niveau3.html')">Niveau 3</button>
    </div>
</div>



<script>
    const music = document.getElementById("music");
    const clickPrompt = document.getElementById("clickPrompt");
    let musicStarted = false;

    // Dès qu'on clique n'importe où, lance la musique
    document.addEventListener("click", () => {
        if (!musicStarted) {
            music.volume = 0.5; // Volume à 50% (0 à 1, pas 0 à 100)
            music.play().then(() => {
                console.log("Musique démarrée !");
                clickPrompt.classList.add("hidden");
            }).catch(err => {
                console.log("Erreur de lecture:", err);
            });
            musicStarted = true;
        }
    });

    // Alternative : tenter de lancer automatiquement au chargement
    window.addEventListener("load", () => {
        music.volume = 0.5;
        music.play().then(() => {
            console.log("Musique auto-démarrée !");
            clickPrompt.classList.add("hidden");
            musicStarted = true;
        }).catch(err => {
            // Si autoplay bloqué par le navigateur, on attend le clic
            console.log("Autoplay bloqué, attente du clic utilisateur");
        });
    });

    function goTo(page) {
        window.location.href = page;
    }
</script>

</body>
</html>
